<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Houses</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307324d'/%3E%3Cpath d='M7 15.5 16 8l9 7.5V24a1 1 0 0 1-1 1h-5.2v-6.2h-5.6V25H8a1 1 0 0 1-1-1v-8.5Z' fill='%2300A0E8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <h1>Open Houses</h1>
        <label class="sr-only" for="officer">Loan officer</label>
        <select id="officer"></select>
        <div class="search">
          <label class="sr-only" for="search">Search any field</label>
          <input id="search" type="search" placeholder="Search any field" title="A price such as 500000 shows that amount or higher." autocomplete="off" />
          <button id="clear" type="button" hidden>Clear</button>
        </div>
        <div class="days" id="days" role="group" aria-label="Day" hidden></div>
        <p class="count" id="count" aria-live="polite"></p>
        <div class="file">
          <label class="btn" title="Opens this file and keeps every older file in the archive.">
            Replace
            <input id="file" type="file" accept=".csv,.xlsx,.xlsm,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" />
          </label>
          <div class="archive-wrap">
            <button class="btn-ghost" id="archiveToggle" type="button" aria-expanded="false" aria-controls="archivePanel">Archive</button>
            <div id="archivePanel" class="archive-panel" hidden></div>
          </div>
        </div>
      </div>
    </header>
    <div class="page">
      <div id="notice" class="notice" hidden></div>
      <main id="results"></main>
    </div>
    <noscript>This page needs JavaScript to read the worksheet and search it.</noscript>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="parse.js"></script>
    <script src="data/seed.js"></script>
    <script src="app.js"></script>
  </body>
</html>
